# /etc/diskwarden/diskwarden.conf
#
# Configuration for diskwarden. This file is PARSED, not executed.
#
# Syntax:
#   [global]          daemon settings + defaults for every mount
#   [mount NAME]      one section per disk (NAME: letters, digits, _ and -)
#   KEY=VALUE         surrounding quotes are optional; no inline comments
#   # or ;            comment lines
#
# Every per-mount setting can be placed in [global] as a default and
# overridden in a [mount NAME] section.
#
# Directories and file names are configured SEPARATELY:
#   *_DIR   = directory only (absolute path)
#   *_NAME  = file name only (no '/')
#
# Placeholders:
#   %NAME%  the mount's NAME     (usable in MOUNT_POINT, *_DIR, *_NAME)
#   %UUID%  the mount's UUID     (usable in MOUNT_POINT, *_DIR, *_NAME)
#   %STATUS% the flag's status word (*_FLAG_NAME; MOUNTED_WORD, SAFE_WORD
#                                 or WARNING_WORD, see "flag files" below)
#   %TS%    creation time        (*_FLAG_NAME; required in SAFE_FLAG_NAME,
#                                 optional in WARNING_FLAG_NAME)
#
# Find a disk's UUID with:   lsblk -o NAME,SIZE,FSTYPE,UUID,LABEL
# Validate this file with:   diskwarden --check
# Apply changes with:        systemctl reload diskwarden
#                            (PROGRAM_DIR / COMMAND_LINK: re-run install.sh)

[global]
# ===== daemon settings ([global] only) =====================================

# Seconds between checks (may be fractional, e.g. 0.5).
POLL_INTERVAL=2

# Where install.sh puts the program, and the admin command symlink pointing
# to it (empty = no symlink). Re-run install.sh after changing these.
PROGRAM_DIR=/usr/libexec/diskwarden
COMMAND_LINK=/usr/sbin/diskwarden

# Private directory (root only, mode 0700) for the status file and for
# requests from "diskwarden --mount/--unmount". Must not overlap flag dirs.
CONTROL_DIR=/run/diskwarden/control

# ===== defaults for all mounts (each one can be overridden per mount) =====

# --- mounting ---
# Filesystem type for mount -t ("auto" = detect it) and mount -o options.
FS_TYPE=auto
MOUNT_OPTIONS=defaults

# Create the mount point directory if it does not exist (yes/no).
CREATE_MOUNT_POINT=yes

# Extra unmount attempts (1 s apart) before giving up when the disk is busy.
# On failure the mounted flag is re-created with the reason inside; delete it
# again to retry.
UMOUNT_RETRIES=3

# --- filesystem check before mounting ---
# FSCK=yes runs "fsck FSCK_OPTIONS -t <type> <device>" before every mount.
# Exit code 0 or 1 (errors corrected): mount. Anything else: do not mount,
# write the warning flag. -p repairs only what is safe without questions.
FSCK=no
FSCK_OPTIONS=-p
# What to do when no fsck tool exists for the filesystem (fsck.<type> not
# installed):  mount = write the warning flag and mount anyway
#              skip  = write the warning flag and do NOT mount
FSCK_UNSUPPORTED_ACTION=mount

# --- flag files ---
# User-facing status words, inserted into the flag names below via %STATUS%.
# Change the wording (or language) here once for all flags. Any characters
# except / % * ? [ ] are allowed; avoid spaces if users work on a command line.
MOUNTED_WORD=MOUNTED
SAFE_WORD=SAFE_TO_DISCONNECT
WARNING_WORD=WARNING

# "Disk is mounted" flag. Delete it to unmount the disk. May be on the disk.
MOUNTED_FLAG_DIR=/srv/diskwarden
MOUNTED_FLAG_NAME=%NAME%_%STATUS%

# "Safe to disconnect" flag, created after unmounting. Not on the disk.
SAFE_FLAG_DIR=/srv/diskwarden
SAFE_FLAG_NAME=%NAME%_%STATUS%_%TS%
# Lifetime in seconds.
SAFE_FLAG_TTL=300

# Warning flag, created when the disk cannot be checked or mounted:
#   - filesystem type not supported (no kernel driver / mount helper)
#   - no fsck tool for the filesystem (see FSCK_UNSUPPORTED_ACTION)
#   - fsck found errors it could not fix, or mount failed
# The file explains the problem. Not on the disk.
WARNING_FLAG_DIR=/srv/diskwarden
WARNING_FLAG_NAME=%NAME%_%STATUS%
# Lifetime in seconds; 0 = keep until the disk is disconnected or mounted.
WARNING_FLAG_TTL=0

# strftime(3) format substituted for %TS%. No '/'.
TIMESTAMP_FORMAT=%Y-%m-%d_%H-%M-%S

# Owner (user or user:group) and mode of created flag files. The user who
# deletes the mounted flag needs WRITE permission on MOUNTED_FLAG_DIR.
# FLAG_MODE must not contain execute bits.
# FLAG_DIR_MODE is applied only to flag directories diskwarden creates itself.
#FLAG_OWNER=root:wheel
FLAG_MODE=0664
FLAG_DIR_MODE=0775

# --- who deleted the mounted flag? (optional) ---
# If the flag directory is shared with Samba and the share logs deletions
# with the full_audit module, diskwarden names the user, IP address and
# computer in the safe-to-disconnect file, in the journal, and in hooks
# (DISKWARDEN_REQUESTED_BY). In smb.conf, for the share with the flags:
#     vfs objects = full_audit
#     full_audit:prefix = %u|%I|%m|%S
#     full_audit:success = unlinkat renameat
#     full_audit:failure = none
#     full_audit:facility = local5
#     full_audit:priority = notice
# AUDIT_LOG: empty = off; "journal" = read the systemd journal (records
# tagged AUDIT_JOURNAL_IDENTIFIER, smbd_audit by default); or the absolute
# path of a log file that rsyslog writes the records to.
AUDIT_LOG=
AUDIT_JOURNAL_IDENTIFIER=smbd_audit

# --- hooks ---
# Shell commands run (as root, in the background) on events. Empty = none.
# Details are passed in environment variables, never inside the command:
#   DISKWARDEN_EVENT        MOUNT, UNMOUNT, DISCONNECT, WARNING or ERROR
#   DISKWARDEN_NAME         mount name
#   DISKWARDEN_UUID         disk UUID
#   DISKWARDEN_DEVICE       device node, e.g. /dev/sdb1 (may be empty)
#   DISKWARDEN_MOUNT_POINT  mount point
#   DISKWARDEN_MOUNTED_FLAG path of the mounted flag
#   DISKWARDEN_MESSAGE      human-readable description
#   DISKWARDEN_REQUESTED_BY who asked for the unmount (UNMOUNT; see AUDIT_LOG)
# Example:
#   ON_MOUNT=logger -t backup "disk $DISKWARDEN_NAME ready"; /usr/local/bin/run-backup
ON_MOUNT=
ON_UNMOUNT=
ON_DISCONNECT=
ON_WARNING=
ON_ERROR=
# Seconds a hook may run before it is killed.
HOOK_TIMEOUT=60


# ===========================================================================
# Mounts
# ===========================================================================

[mount backup1]
UUID=0a1b2c3d-1111-2222-3333-444455556666
MOUNT_POINT=/mnt/backup1
FSCK=yes

[mount archive]
UUID=7e8f9a0b-aaaa-bbbb-cccc-ddddeeeeffff
MOUNT_POINT=/mnt/archive
FS_TYPE=xfs
MOUNT_OPTIONS=defaults,noatime
MOUNTED_FLAG_DIR=/home/operator/disks
SAFE_FLAG_DIR=/home/operator/disks
WARNING_FLAG_DIR=/home/operator/disks
# Own wording for this disk; the names stay as in [global] plus ".txt".
MOUNTED_WORD=is_mounted
SAFE_WORD=can_be_disconnected
WARNING_WORD=PROBLEM
MOUNTED_FLAG_NAME=%NAME%_%STATUS%.txt
SAFE_FLAG_NAME=%NAME%_%STATUS%_%TS%.txt
WARNING_FLAG_NAME=%NAME%_%STATUS%.txt
FLAG_OWNER=operator:operator

# Example: USB stick with FAT/exFAT (UUID looks like ABCD-1234). Such
# filesystems have no Unix owners; give the user access via mount options.
#[mount usbstick]
#UUID=ABCD-1234
#MOUNT_POINT=/mnt/usbstick
#FS_TYPE=exfat
#MOUNT_OPTIONS=uid=1000,gid=1000,umask=0022
